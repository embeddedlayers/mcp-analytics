name: Docs drift check

# LAT-1878 — verify this repo's public claims against the live platform.
#
# The signup grant has been wrong in public twice (LAT-1680, LAT-1876). Both
# times the docs said 2,000 while the platform granted 500. The second time it
# survived nineteen days AFTER the API-side copy was fixed and gated, because
# nothing checked these files.
#
# Deliberately needs NO secrets: the figure is published on a public,
# unauthenticated endpoint (GET /api/v1/pipeline/tiers) precisely so this check
# can run from a public repo without DB access.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 12:20 UTC daily. The docs can go stale without anyone touching this repo —
    # a reprice or a grant change happens elsewhere — so a push-only trigger
    # would be blind to the exact failure mode that caused LAT-1876.
    - cron: "20 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # the scheduled-failure reporter below files/comments on an issue

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check docs against the live platform
        run: python3 scripts/check-docs-drift.py

      # A scheduled failure is invisible unless someone looks at the Actions
      # tab. This surfaces it as an issue — but only on the scheduled run, so a
      # PR that introduces drift gets a red check (which the author sees) rather
      # than a duplicate issue every push.
      - name: Report drift as an issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Docs drift: public claims disagree with the live platform';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'docs-drift',
            });
            const body = [
              'The scheduled docs-drift check failed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Reproduce locally:',
              '```',
              'python3 scripts/check-docs-drift.py',
              '```',
              '',
              'The platform is the source of truth:',
              '```',
              "curl -s https://api.mcpanalytics.ai/api/v1/pipeline/tiers | python3 -c \"import json,sys;print(json.load(sys.stdin)['welcome_credits'])\"",
              '```',
            ].join('\n');
            if (existing.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['docs-drift'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing[0].number, body,
              });
            }
